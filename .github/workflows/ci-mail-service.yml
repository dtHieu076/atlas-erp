name: CI - Build & Push Mail Service

on:
  push:
    branches:
      - main
    # Chỉ kích hoạt CI khi có thay đổi trong code của mail-service
    paths:
      - 'mail-service/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Bước 1 - Kéo mã nguồn
        uses: actions/checkout@v4

      - name: 🐳 Bước 2 - Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Bước 3 - Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Bước 4 - Build & Push Docker Image cho Mail Service
        uses: docker/build-push-action@v5
        with:
          context: ./mail-service
          file: ./mail-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mail-service:${{ github.sha }}

      - name: 🔄 Bước 5 - Cập nhật tag vào Config Repo (ArgoCD)
        run: |
          # 1. Clone repo cấu hình (atlas-erp-config-k8s)
          git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/dtHieu076/atlas-erp-config-k8s.git
          cd atlas-erp-config-k8s

          # 2. Định danh cho con Bot
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # 3. Tìm và đổi tag image trong file mail-deployment.yaml
          # Lưu ý: Theo cây thư mục bạn gửi trước đây, file này được viết đúng chính tả là "mail-deployment.yaml"
          sed -i "s|image: ${{ secrets.DOCKERHUB_USERNAME }}/mail-service:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/mail-service:${{ github.sha }}|g" 2-apps/mail-k8s/mail-deployment.yaml

          # 4. Commit và đẩy cấu hình mới lên GitHub
          git add 2-apps/mail-k8s/mail-deployment.yaml
          git commit -m "CD: Tự động cập nhật mail-service image tag thành ${{ github.sha }}"
          git push