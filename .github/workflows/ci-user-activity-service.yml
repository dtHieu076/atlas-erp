name: CI - Build & Push User Activity Quarkus Service

on:
  push:
    branches:
      - main
    paths:
      - 'user-activity-quarkus-service/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Bước 1 - Kéo mã nguồn
        uses: actions/checkout@v4

      # --- PHẦN THÊM MỚI BẮT ĐẦU TỪ ĐÂY ---
      - name: ☕ Bước 1.5 - Thiết lập Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Khớp với phiên bản Java bạn dùng
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Bước 1.6 - Build mã nguồn bằng Maven
        working-directory: ./user-activity-quarkus-service
        run: ./mvnw clean package -DskipTests
      # --- KẾT THÚC PHẦN THÊM MỚI ---

      - name: 🐳 Bước 2 - Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Bước 3 - Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Bước 4 - Build & Push Docker Image cho User Activity Service
        uses: docker/build-push-action@v5
        with:
          context: ./user-activity-quarkus-service
          file: ./user-activity-quarkus-service/src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-activity-service:${{ github.sha }}

      - name: 🔄 Bước 5 - Cập nhật tag vào Config Repo (ArgoCD)
        run: |
          git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/dtHieu076/atlas-erp-config-k8s.git
          cd atlas-erp-config-k8s
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          sed -i "s|image: ${{ secrets.DOCKERHUB_USERNAME }}/user-activity-service:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/user-activity-service:${{ github.sha }}|g" 2-apps/user-activity-k8s/user-activity-deloyment.yaml
          git add 2-apps/user-activity-k8s/user-activity-deloyment.yaml
          git commit -m "CD: Tự động cập nhật user-activity-service image tag thành ${{ github.sha }}"
          git push