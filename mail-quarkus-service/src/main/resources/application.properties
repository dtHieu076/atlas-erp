quarkus.application.name=mail-quarkus-service
quarkus.application.version=1.0.0

# Server Configuration
quarkus.http.port=8080

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc=true
quarkus.datasource.jdbc.url=jdbc:postgresql://ep-nameless-flower-ahqfkw3x-pooler.c-3.us-east-1.aws.neon.tech/mail-db?sslmode=require
quarkus.datasource.username=neondb_owner
quarkus.datasource.password=npg_ODZx4pvMKCU1

# JPA/Hibernate Configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Kafka Configuration
quarkus.kafka.bootstrap.servers=kafka-2d3930ef-student-337e.g.aivencloud.com:24786
kafka.security.protocol=SSL
kafka.ssl.keystore.location=certs/kafka.keystore.p12
kafka.ssl.keystore.password=changeit
kafka.ssl.keystore.type=PKCS12
kafka.ssl.truststore.location=certs/kafka.truststore.jks
kafka.ssl.truststore.password=changeit
kafka.ssl.truststore.type=PKCS12

# Kafka Consumer Configuration
mp.messaging.incoming.mail-requests.connector=smallrye-kafka
mp.messaging.incoming.mail-requests.topic=mail_requests
mp.messaging.incoming.mail-requests.group.id=mail-quarkus-service-group
mp.messaging.incoming.mail-requests.auto.offset.reset=earliest
mp.messaging.incoming.mail-requests.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.mail-requests.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Mail Configuration
quarkus.mailer.host=mailhog-service
quarkus.mailer.port=1025
quarkus.mailer.from=DangThanhHieu@atlas-erp.com
quarkus.mailer.auth-methods=DISABLED

# App Configuration
app.mail.batch-size=100
app.mail.max-retries=3
app.mail.topic=mail_requests

# Dev/Test Configuration
quarkus.log.level=INFO
quarkus.log.category."org.atlas_erp".level=DEBUG
