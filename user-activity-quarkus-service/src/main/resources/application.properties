# ==========================================
# CẤU HÌNH KAFKA SERVER (Chung)
# ==========================================
# 1. Địa chỉ Server chung
kafka.bootstrap.servers=kafka-2d3930ef-student-337e.g.aivencloud.com:24786
# Cấu hình cho Consumer (SmallRye)
mp.messaging.connector.smallrye-kafka.security.protocol=SSL
mp.messaging.connector.smallrye-kafka.ssl.keystore.type=PKCS12
mp.messaging.connector.smallrye-kafka.ssl.keystore.password=changeit
mp.messaging.connector.smallrye-kafka.ssl.truststore.type=PKCS12
mp.messaging.connector.smallrye-kafka.ssl.truststore.password=changeit
# ĐƯỜNG DẪN QUAN TRỌNG: 
# Khi chạy trong Docker, đường dẫn tương đối sẽ tính từ /deployments
mp.messaging.connector.smallrye-kafka.ssl.keystore.location=/deployments/certs/kafka.keystore.p12
mp.messaging.connector.smallrye-kafka.ssl.truststore.location=/deployments/certs/kafka.truststore.jks
# Nếu bạn có dùng LogProducer thủ công, hãy dùng tiền tố 'kafka.' nhưng phải đúng chuẩn Quarkus:
kafka.ssl.keystore.location=/deployments/certs/kafka.keystore.p12
kafka.ssl.truststore.location=/deployments/certs/kafka.truststore.jks
# ==========================================
# KAFKA PRODUCER (Kênh gửi đi: user-activity-out)
# ==========================================
mp.messaging.outgoing.user-activity-out.connector=smallrye-kafka
mp.messaging.outgoing.user-activity-out.topic=user-activity-log
mp.messaging.outgoing.user-activity-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.user-activity-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.user-activity-out.acks=all
mp.messaging.outgoing.user-activity-out.retries=3
# ==========================================
# KAFKA CONSUMER (Kênh nhận về: user-activity-in)
# ==========================================
mp.messaging.incoming.user-activity-in.connector=smallrye-kafka
mp.messaging.incoming.user-activity-in.topic=user-activity-log
mp.messaging.incoming.user-activity-in.group.id=user-activity-consumer
mp.messaging.incoming.user-activity-in.auto.offset.reset=earliest
mp.messaging.incoming.user-activity-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.user-activity-in.value.deserializer=org.atlas_erp.dto.deserializer.ActivityLogRequestDeserializer