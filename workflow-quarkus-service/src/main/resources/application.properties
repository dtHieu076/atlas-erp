# ===============================
# CORS Configuration
# ===============================
# 1. Bật tính năng CORS (Tương đương việc đăng ký filter)
quarkus.http.cors=true
# 2. Các domain được phép gọi API (Tương đương setAllowedOrigins)
quarkus.http.cors.origins=http://localhost:3000,https://adminfrontend-bice-eta.vercel.app
# 3. Cho phép gửi cookie/token xác thực (Tương đương setAllowCredentials(true))
quarkus.http.cors.access-control-allow-credentials=true
# 4. Các header được phép gửi lên (Tương đương setAllowedHeaders("*"))
quarkus.http.cors.headers=*
# 5. Các HTTP Method được phép (Tương đương setAllowedMethods("*"))
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS